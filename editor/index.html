<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OasisSpaces Editor</title>
<style>
  :root {
    --panel: rgba(24, 26, 30, 0.92);
    --text: #e8e6e0;
    --muted: #9a978f;
    --accent: #e8a33d;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #101114;
    font-family: -apple-system, "Segoe UI", sans-serif; color: var(--text); }
  #canvas-host { position: absolute; inset: 0; }
  #canvas-host canvas { display: block; }

  .panel { position: absolute; top: 14px; left: 14px; width: 232px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; backdrop-filter: blur(8px);
    font-size: 13px; z-index: 10; }
  .panel h1 { font-size: 15px; font-weight: 650; letter-spacing: 0.2px;
    margin-bottom: 2px; }
  .panel h1 span { color: var(--accent); }
  .panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row button { flex: 1; }
  button, label.filebtn {
    background: #2a2d33; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; font-size: 12px; cursor: pointer;
    text-align: center; transition: background 0.15s; user-select: none; }
  button:hover, label.filebtn:hover { background: #383c44; }
  button.active { background: var(--accent); color: #17130a; border-color: transparent; }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type=file] { display: none; }
  .slider-row { display: flex; align-items: center; gap: 8px;
    margin: 10px 0 6px; color: var(--muted); font-size: 11px; }
  .slider-row input { flex: 1; accent-color: var(--accent); }
  .divider { height: 1px; background: var(--border); margin: 10px 0; }
  .keys { color: var(--muted); font-size: 11px; line-height: 1.7; }
  .keys b { color: var(--text); font-weight: 600; font-family: ui-monospace, monospace;
    background: #2a2d33; border-radius: 4px; padding: 0 5px; }

  #stats { position: absolute; bottom: 14px; left: 14px; z-index: 10;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--muted); }
  #stats b { color: var(--text); }
  #stats .sel { color: var(--accent); }

  #selrect { position: absolute; border: 1.5px dashed var(--accent);
    background: rgba(232, 163, 61, 0.12); display: none; z-index: 5;
    pointer-events: none; }
  #drophint { position: absolute; inset: 0; display: none; z-index: 20;
    background: rgba(16, 17, 20, 0.85); border: 3px dashed var(--accent);
    border-radius: 16px; margin: 20px; }
  #drophint div { position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); font-size: 20px; color: var(--accent); }
  #toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; z-index: 30; display: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="canvas-host"></div>
<div id="selrect"></div>
<div id="drophint"><div>Drop a .ply file to open it</div></div>
<div id="toast"></div>

<div class="panel">
  <h1>Oasis<span>Spaces</span> Editor</h1>
  <div class="sub">point cloud viewer &amp; editor</div>

  <div class="row">
    <label class="filebtn" for="file">Open PLY…</label>
    <input type="file" id="file" accept=".ply">
    <button id="load-sample">Sample room</button>
  </div>

  <div class="divider"></div>

  <div class="row">
    <button id="mode-nav" class="active">Navigate</button>
    <button id="mode-select">Select</button>
  </div>
  <div class="row">
    <button id="btn-delete" disabled>Delete</button>
    <button id="btn-crop" disabled>Crop</button>
    <button id="btn-invert" disabled>Invert</button>
  </div>
  <div class="row">
    <button id="btn-undo" disabled>Undo</button>
    <button id="btn-export" disabled>Export PLY</button>
  </div>

  <div class="slider-row">size
    <input type="range" id="psize" min="1" max="20" value="4">
  </div>
  <div class="row">
    <button id="btn-up">Up axis: Z</button>
    <button id="btn-reset">Reset view</button>
  </div>

  <div class="divider"></div>
  <div class="keys">
    <b>drag</b> select box &nbsp; <b>⇧</b> add &nbsp; <b>⌥</b> remove<br>
    <b>X</b> delete &nbsp; <b>C</b> crop &nbsp; <b>I</b> invert &nbsp; <b>Esc</b> clear<br>
    <b>⌘Z</b> undo &nbsp; <b>V</b>/<b>S</b> switch mode
  </div>
</div>

<div id="stats">no cloud loaded</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const HIGHLIGHT = [1.0, 0.64, 0.24];
const MAX_UNDO = 8;

const host = document.getElementById('canvas-host');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101114);
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const grid = new THREE.GridHelper(10, 20, 0x33363c, 0x22242a);
grid.rotation.x = Math.PI / 2; // Z-up by default
scene.add(grid);

// --- cloud state -----------------------------------------------------------
let positions = null;      // Float32Array N*3
let colors = null;         // Float32Array N*3 (0..1)
let selected = null;       // Uint8Array N
let points = null;         // THREE.Points
let undoStack = [];
let mode = 'nav';
let zUp = true;
let cloudName = 'cloud';

function setCloud(pos, col, name) {
  positions = pos; colors = col; cloudName = name || cloudName;
  selected = new Uint8Array(pos.length / 3);
  undoStack = [];
  rebuild();
  fitView();
  updateUI();
}

function rebuild() {
  if (points) { scene.remove(points); points.geometry.dispose(); points.material.dispose(); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const display = new Float32Array(colors); // copy; selected get highlight color
  for (let i = 0; i < selected.length; i++) {
    if (selected[i]) {
      display[i * 3] = HIGHLIGHT[0];
      display[i * 3 + 1] = HIGHLIGHT[1];
      display[i * 3 + 2] = HIGHLIGHT[2];
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(display, 3));
  const mat = new THREE.PointsMaterial({
    size: Number(psize.value) * 0.004, vertexColors: true, sizeAttenuation: true,
  });
  points = new THREE.Points(geo, mat);
  scene.add(points);
}

function refreshSelectionColors() {
  const attr = points.geometry.getAttribute('color');
  const display = attr.array;
  for (let i = 0; i < selected.length; i++) {
    const j = i * 3;
    if (selected[i]) {
      display[j] = HIGHLIGHT[0]; display[j + 1] = HIGHLIGHT[1]; display[j + 2] = HIGHLIGHT[2];
    } else {
      display[j] = colors[j]; display[j + 1] = colors[j + 1]; display[j + 2] = colors[j + 2];
    }
  }
  attr.needsUpdate = true;
  updateUI();
}

function robustBox() {
  // Sparse reconstructions carry a few far-field junk points that can
  // inflate the bounding box several-fold; fit the camera to the 5th-95th
  // percentile box instead so the actual space fills the view.
  const n = positions.length / 3;
  const stride = Math.max(1, Math.floor(n / 50_000));
  const min = new THREE.Vector3(), max = new THREE.Vector3();
  for (let axis = 0; axis < 3; axis++) {
    const vals = [];
    for (let i = 0; i < n; i += stride) vals.push(positions[i * 3 + axis]);
    vals.sort((a, b) => a - b);
    min.setComponent(axis, vals[Math.floor(vals.length * 0.05)]);
    max.setComponent(axis, vals[Math.floor(vals.length * 0.95)]);
  }
  return new THREE.Box3(min, max);
}

function fitView() {
  const box = robustBox();
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  controls.target.copy(center);
  camera.up.set(0, zUp ? 0 : 1, zUp ? 1 : 0);
  const dir = zUp ? new THREE.Vector3(0.7, -1, 0.55) : new THREE.Vector3(0.7, 0.55, 1);
  camera.position.copy(center).addScaledVector(dir.normalize(), size * 0.9);
  camera.near = size / 1000; camera.far = size * 20;
  camera.updateProjectionMatrix();
  grid.position.copy(center);
  grid.position.z = zUp ? box.min.z : grid.position.z;
  grid.position.y = zUp ? grid.position.y : box.min.y;
  grid.rotation.x = zUp ? Math.PI / 2 : 0;
  const gscale = size / 10;
  grid.scale.setScalar(gscale);
  controls.update();
}

// --- editing ops -----------------------------------------------------------
function snapshot() {
  undoStack.push({ positions: positions.slice(), colors: colors.slice(),
                   selected: selected.slice() });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function filterCloud(keepFn) {
  const n = selected.length;
  let kept = 0;
  for (let i = 0; i < n; i++) if (keepFn(i)) kept++;
  if (kept === n) return;
  if (kept === 0) { toast('That would remove every point'); undoStack.pop(); return; }
  const np = new Float32Array(kept * 3), nc = new Float32Array(kept * 3);
  let k = 0;
  for (let i = 0; i < n; i++) {
    if (keepFn(i)) {
      np[k * 3] = positions[i * 3]; np[k * 3 + 1] = positions[i * 3 + 1];
      np[k * 3 + 2] = positions[i * 3 + 2];
      nc[k * 3] = colors[i * 3]; nc[k * 3 + 1] = colors[i * 3 + 1];
      nc[k * 3 + 2] = colors[i * 3 + 2];
      k++;
    }
  }
  positions = np; colors = nc; selected = new Uint8Array(kept);
  rebuild(); updateUI();
}

function deleteSelected() {
  if (!anySelected()) return;
  snapshot();
  filterCloud(i => !selected[i]);
}
function cropToSelected() {
  if (!anySelected()) return;
  snapshot();
  filterCloud(i => selected[i]);
}
function invertSelection() {
  if (!points) return;
  for (let i = 0; i < selected.length; i++) selected[i] = selected[i] ? 0 : 1;
  refreshSelectionColors();
}
function clearSelection() {
  if (!points) return;
  selected.fill(0);
  refreshSelectionColors();
}
function undo() {
  const prev = undoStack.pop();
  if (!prev) return;
  positions = prev.positions; colors = prev.colors; selected = prev.selected;
  rebuild(); updateUI();
}
function anySelected() {
  if (!selected) return false;
  for (let i = 0; i < selected.length; i++) if (selected[i]) return true;
  return false;
}

// --- rectangle selection ---------------------------------------------------
const selrect = document.getElementById('selrect');
let dragStart = null;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode !== 'select' || !points || e.button !== 0) return;
  dragStart = { x: e.clientX, y: e.clientY };
  selrect.style.display = 'block';
  drawRect(e);
});
window.addEventListener('pointermove', (e) => { if (dragStart) drawRect(e); });
window.addEventListener('pointerup', (e) => {
  if (!dragStart) return;
  const rect = currentRect(e);
  selrect.style.display = 'none';
  const start = dragStart; dragStart = null;
  if (rect.w < 3 && rect.h < 3) return; // a click, not a drag
  applyRectSelection(rect, e.shiftKey ? 'add' : (e.altKey ? 'remove' : 'replace'));
});

function currentRect(e) {
  const x0 = Math.min(dragStart.x, e.clientX), y0 = Math.min(dragStart.y, e.clientY);
  const w = Math.abs(e.clientX - dragStart.x), h = Math.abs(e.clientY - dragStart.y);
  return { x: x0, y: y0, w, h };
}
function drawRect(e) {
  const r = currentRect(e);
  selrect.style.left = r.x + 'px'; selrect.style.top = r.y + 'px';
  selrect.style.width = r.w + 'px'; selrect.style.height = r.h + 'px';
}

function applyRectSelection(r, op) {
  const canvas = renderer.domElement;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  camera.updateMatrixWorld();
  const mvp = new THREE.Matrix4()
    .multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  const el = mvp.elements;
  const n = selected.length;
  for (let i = 0; i < n; i++) {
    const x = positions[i * 3], y = positions[i * 3 + 1], z = positions[i * 3 + 2];
    const w = el[3] * x + el[7] * y + el[11] * z + el[15];
    if (w <= 0) { if (op === 'replace') selected[i] = 0; continue; }
    const sx = ((el[0] * x + el[4] * y + el[8] * z + el[12]) / w * 0.5 + 0.5) * cw;
    const sy = (-(el[1] * x + el[5] * y + el[9] * z + el[13]) / w * 0.5 + 0.5) * ch;
    const inside = sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h;
    if (op === 'replace') selected[i] = inside ? 1 : 0;
    else if (op === 'add' && inside) selected[i] = 1;
    else if (op === 'remove' && inside) selected[i] = 0;
  }
  refreshSelectionColors();
}

// --- PLY I/O ---------------------------------------------------------------
const loader = new PLYLoader();

function loadArrayBuffer(buffer, name) {
  let geo;
  try { geo = loader.parse(buffer); }
  catch (err) { toast('Could not parse PLY: ' + err.message); return; }
  const pos = geo.getAttribute('position');
  if (!pos || pos.count === 0) { toast('PLY has no points'); return; }
  let col = geo.getAttribute('color');
  let colArr;
  if (col) {
    colArr = new Float32Array(col.count * 3);
    for (let i = 0; i < col.count; i++) {
      colArr[i * 3] = col.getX(i); colArr[i * 3 + 1] = col.getY(i);
      colArr[i * 3 + 2] = col.getZ(i);
    }
  } else {
    colArr = new Float32Array(pos.count * 3).fill(0.7);
  }
  setCloud(new Float32Array(pos.array), colArr, name.replace(/\.ply$/i, ''));
  toast(`Loaded ${pos.count.toLocaleString()} points`);
}

document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (f) loadArrayBuffer(await f.arrayBuffer(), f.name);
  e.target.value = '';
});

document.getElementById('load-sample').addEventListener('click', async () => {
  try {
    const res = await fetch('../spaces/sample-room/cloud.ply');
    if (!res.ok) throw new Error(res.statusText);
    loadArrayBuffer(await res.arrayBuffer(), 'sample-room');
  } catch {
    toast('Sample not found — run scripts/make_sample.py and serve the project root');
  }
});

// drag & drop
let dragDepth = 0;
const drophint = document.getElementById('drophint');
window.addEventListener('dragenter', (e) => {
  e.preventDefault(); dragDepth++; drophint.style.display = 'block';
});
window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; drophint.style.display = 'none'; }
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault(); dragDepth = 0; drophint.style.display = 'none';
  const f = e.dataTransfer.files[0];
  if (f && f.name.toLowerCase().endsWith('.ply')) {
    loadArrayBuffer(await f.arrayBuffer(), f.name);
  } else if (f) toast('Only .ply files are supported');
});

function exportPly() {
  if (!points) return;
  const n = positions.length / 3;
  const header =
    'ply\nformat binary_little_endian 1.0\n' +
    `element vertex ${n}\n` +
    'property float x\nproperty float y\nproperty float z\n' +
    'property uchar red\nproperty uchar green\nproperty uchar blue\n' +
    'end_header\n';
  const head = new TextEncoder().encode(header);
  const body = new ArrayBuffer(n * 15);
  const view = new DataView(body);
  for (let i = 0; i < n; i++) {
    const o = i * 15;
    view.setFloat32(o, positions[i * 3], true);
    view.setFloat32(o + 4, positions[i * 3 + 1], true);
    view.setFloat32(o + 8, positions[i * 3 + 2], true);
    view.setUint8(o + 12, Math.round(colors[i * 3] * 255));
    view.setUint8(o + 13, Math.round(colors[i * 3 + 1] * 255));
    view.setUint8(o + 14, Math.round(colors[i * 3 + 2] * 255));
  }
  const blob = new Blob([head, body], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${cloudName}-edited.ply`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- UI wiring -------------------------------------------------------------
const psize = document.getElementById('psize');
psize.addEventListener('input', () => {
  if (points) points.material.size = Number(psize.value) * 0.004;
});

const modeNav = document.getElementById('mode-nav');
const modeSel = document.getElementById('mode-select');
function setMode(m) {
  mode = m;
  modeNav.classList.toggle('active', m === 'nav');
  modeSel.classList.toggle('active', m === 'select');
  controls.enabled = (m === 'nav');
  renderer.domElement.style.cursor = m === 'select' ? 'crosshair' : 'grab';
}
modeNav.addEventListener('click', () => setMode('nav'));
modeSel.addEventListener('click', () => setMode('select'));

document.getElementById('btn-delete').addEventListener('click', deleteSelected);
document.getElementById('btn-crop').addEventListener('click', cropToSelected);
document.getElementById('btn-invert').addEventListener('click', invertSelection);
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-export').addEventListener('click', exportPly);
document.getElementById('btn-reset').addEventListener('click', () => points && fitView());
document.getElementById('btn-up').addEventListener('click', () => {
  zUp = !zUp;
  document.getElementById('btn-up').textContent = `Up axis: ${zUp ? 'Z' : 'Y'}`;
  if (points) fitView();
});

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  switch (e.key.toLowerCase()) {
    case 'x': case 'backspace': case 'delete': deleteSelected(); break;
    case 'c': if (!meta) cropToSelected(); break;
    case 'i': invertSelection(); break;
    case 'escape': clearSelection(); break;
    case 'v': setMode('nav'); break;
    case 's': if (!meta) setMode('select'); break;
  }
});

const stats = document.getElementById('stats');
function updateUI() {
  const has = !!points;
  let selCount = 0;
  if (selected) for (let i = 0; i < selected.length; i++) selCount += selected[i];
  document.getElementById('btn-delete').disabled = !selCount;
  document.getElementById('btn-crop').disabled = !selCount;
  document.getElementById('btn-invert').disabled = !has;
  document.getElementById('btn-undo').disabled = !undoStack.length;
  document.getElementById('btn-export').disabled = !has;
  stats.innerHTML = has
    ? `<b>${(positions.length / 3).toLocaleString()}</b> points` +
      (selCount ? ` · <span class="sel">${selCount.toLocaleString()} selected</span>` : '')
    : 'no cloud loaded';
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

// ?load=<url-or-path> opens a cloud straight from the address bar,
// e.g. /editor/?load=/spaces/first-test/cloud.ply
const autoload = new URLSearchParams(location.search).get('load');
if (autoload) {
  fetch(autoload)
    .then((res) => { if (!res.ok) throw new Error(res.statusText); return res.arrayBuffer(); })
    .then((buf) => loadArrayBuffer(buf, autoload.split('/').pop() || 'cloud'))
    .catch((err) => toast(`Could not load ${autoload}: ${err.message}`));
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
